# CareCircle static site, served by Nginx (Cloud Run container).
server {
    # Cloud Run expects the container to listen on 8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Compress the text assets the Vite build produces.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite writes content-hashed files into /assets, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The HTML shell must be revalidated every time, otherwise a new deployment
    # keeps loading the previous bundle from the browser cache.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: an unknown path returns index.html, so refreshing a
    # client-side route still loads the app instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
